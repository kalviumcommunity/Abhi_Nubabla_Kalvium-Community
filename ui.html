<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Streaming Chat - Progressive Answers with Citations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .chat-section {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.assistant .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }

        .message-timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .citation-marker {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
            font-weight: bold;
            margin: 0 2px;
            cursor: pointer;
            vertical-align: super;
            transition: all 0.2s;
        }

        .citation-marker:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .input-section {
            border-top: 1px solid #eee;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            height: 44px;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            background: #f5f5f5;
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        .sources-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .source-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid #667eea;
        }

        .source-item:hover {
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .source-marker {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }

        .source-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .source-detail {
            font-size: 12px;
            color: #666;
        }

        .source-preview {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s;
        }

        .source-item.expanded .source-preview {
            max-height: 200px;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .info-panel {
            background: #f0f4ff;
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 13px;
            color: #333;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                max-height: 300px;
            }

            .message-bubble {
                max-width: 100%;
            }
        }

        .no-sources {
            color: #999;
            text-align: center;
            padding: 20px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-section">
            <div class="chat-header">
                RAG Streaming Chat with Citations
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="message assistant">
                    <div class="message-bubble">
                        👋 Welcome! Ask me a question and watch the answer appear progressively with citations.
                    </div>
                </div>
            </div>

            <div class="input-section">
                <textarea 
                    id="messageInput" 
                    placeholder="Ask a question..." 
                    rows="1"
                ></textarea>
                <button id="sendButton">Send</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">Sources</div>
            <div class="sources-list" id="sourcesList">
                <div class="no-sources">Retrieved sources will appear here</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        class RAGStreamingChat {
            constructor() {
                this.messagesContainer = document.getElementById('messagesContainer');
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.sourcesList = document.getElementById('sourcesList');
                this.currentSources = [];
                this.citationMap = new Map(); // Maps citation marker to source
                
                this.setupEventListeners();
            }

            setupEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
            }

            async sendMessage() {
                const question = this.messageInput.value.trim();
                if (!question || this.sendButton.disabled) return;

                // Add user message
                this.addMessage('user', question);
                this.messageInput.value = '';
                this.sendButton.disabled = true;

                // Clear previous sources
                this.currentSources = [];
                this.citationMap.clear();

                // Create assistant message placeholder
                const messageId = 'msg-' + Date.now();
                const messageBubble = document.createElement('div');
                messageBubble.className = 'message-bubble';
                messageBubble.innerHTML = '<div class="loading-indicator"><div class="spinner"></div> Generating answer...</div>';
                
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant';
                messageDiv.appendChild(messageBubble);
                this.messagesContainer.appendChild(messageDiv);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;

                try {
                    await this.streamAnswer(question, messageBubble);
                } catch (error) {
                    messageBubble.innerHTML = `<div class="error-message">❌ Error: ${error.message}</div>`;
                }

                this.sendButton.disabled = false;
            }

            async streamAnswer(question, messageBubble) {
                const response = await fetch(`${API_BASE_URL}/query/stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        k: 3,
                        score_threshold: 0.0
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let answerText = '';
                let currentMetrics = {};

                messageBubble.innerHTML = ''; // Clear loading indicator

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const text = decoder.decode(value, { stream: true });
                        const lines = text.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const event = JSON.parse(line.slice(6));
                                    await this.handleStreamEvent(event, messageBubble);
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }
                    }
                } finally {
                    reader.releaseLock();
                }
            }

            async handleStreamEvent(event, messageBubble) {
                switch (event.type) {
                    case 'start':
                        messageBubble.innerHTML = '';
                        break;

                    case 'token':
                        // Append token to message
                        const token = event.data.token || '';
                        messageBubble.innerHTML += this.escapeHtml(token);
                        this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                        break;

                    case 'citation':
                        // Add citation marker
                        const marker = event.data.marker;
                        const citationHtml = `<span class="citation-marker" data-citation="${marker}" title="${event.data.source.document}">${marker.slice(1, -1)}</span>`;
                        messageBubble.innerHTML += citationHtml;
                        this.citationMap.set(marker, event.data.source);
                        
                        // Attach click handler to new citation marker
                        setTimeout(() => {
                            const markers = messageBubble.querySelectorAll('.citation-marker');
                            markers.forEach(m => {
                                if (!m.hasClickListener) {
                                    m.addEventListener('click', (e) => this.showSourceDetail(e.target.dataset.citation));
                                    m.hasClickListener = true;
                                }
                            });
                        }, 0);
                        break;

                    case 'sources':
                        // Update sources list
                        this.currentSources = event.data.sources || [];
                        this.displaySources();
                        break;

                    case 'complete':
                        // Add completion info
                        const metrics = event.data;
                        const infoHtml = `<div class="info-panel">
                            ✓ Answer complete • ${metrics.latency_ms}ms • ${metrics.retrieval_count} sources
                        </div>`;
                        messageBubble.innerHTML += infoHtml;
                        break;

                    case 'error':
                        messageBubble.innerHTML = `<div class="error-message">
                            ❌ Error: ${event.data.message || 'Unknown error occurred'}
                        </div>`;
                        break;
                }
            }

            displaySources() {
                this.sourcesList.innerHTML = '';
                
                if (this.currentSources.length === 0) {
                    this.sourcesList.innerHTML = '<div class="no-sources">No sources retrieved</div>';
                    return;
                }

                this.currentSources.forEach((source, index) => {
                    const sourceItem = document.createElement('div');
                    sourceItem.className = 'source-item';
                    sourceItem.innerHTML = `
                        <div style="display: flex; align-items: center; margin-bottom: 8px;">
                            <span class="source-marker">${source.rank}</span>
                            <div>
                                <div class="source-title">${this.escapeHtml(source.source_document)}</div>
                                <div class="source-detail">${this.escapeHtml(source.section)}</div>
                            </div>
                        </div>
                        <div class="source-preview" style="display: none;">
                            <strong>Chunk ID:</strong> ${this.escapeHtml(source.chunk_id)}<br>
                            <strong>Score:</strong> ${source.similarity_score.toFixed(3)}<br>
                            <strong>Tokens:</strong> ${source.token_count}
                        </div>
                    `;

                    sourceItem.addEventListener('click', () => {
                        sourceItem.classList.toggle('expanded');
                        const preview = sourceItem.querySelector('.source-preview');
                        preview.style.display = sourceItem.classList.contains('expanded') ? 'block' : 'none';
                    });

                    this.sourcesList.appendChild(sourceItem);
                });
            }

            showSourceDetail(marker) {
                const source = this.citationMap.get(marker);
                if (!source) return;

                alert(`Source ${marker}:\n\nDocument: ${source.document}\nSection: ${source.section}\nChunk ID: ${source.chunk_id}`);
            }

            addMessage(role, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = content;
                
                messageDiv.appendChild(bubble);
                
                const timestamp = document.createElement('div');
                timestamp.className = 'message-timestamp';
                timestamp.textContent = new Date().toLocaleTimeString();
                messageDiv.appendChild(timestamp);
                
                this.messagesContainer.appendChild(messageDiv);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize chat when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RAGStreamingChat();
        });
    </script>
</body>
</html>
